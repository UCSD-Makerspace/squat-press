# lift_monitor.cfg — configuration for continuous_lift_monitor
# Edit any value here; press R at the calibration prompt to reload,
# or send SIGHUP / press Ctrl+R mid-session to hot-reload.

[sensor]
# Serial port hint (auto-detected if left blank)
port =

# Baud rate
baud_rate = 115200

[detection]
# Position (mm) the sensor must exceed to start a potential lift
lift_threshold = 19.0

# Seconds the sensor must stay above lift_threshold to confirm a valid lift
min_lift_duration = 0.040

# Position (mm) the sensor must DROP BELOW after a confirmed lift before
# the next lift can be detected  (prevent the mice from optimizing lifts)
drop_threshold = 5.0

# Seconds that must elapse between consecutive confirmed lifts
# (visualised in --gui mode; pellet dispenser cooldown placeholder)
pellet_cooldown = 3.0

[recording]
# Samples kept in the rolling PRE-LIFT buffer (captured BEFORE threshold crossing).
# Total CSV = window_size pre-lift points + all points during the lift itself.
# At ~200-250 Hz: 600 samples ~ 3 seconds of pre-lift context.
window_size = 600

[calibration]
# Constant offset (mm) to subtract from every reading.
# Run the script, observe the 15-sample calibration poll, then set this.
zero_offset_calibration = 0.0

[gui]
# Width of the scrolling position window in seconds
gui_window_size = 10.0
